[workspace]
resolver = "2"
members = ["crates/ncom-core", "crates/ncom-ffi", "crates/ncomd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.74"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ncom-core = { path = "crates/ncom-core" }

[profile.release]
lto = "thin"
codegen-units = 1
